<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="動畫圖解">
<meta name="theme-color" content="#4f46e5">
<meta name="format-detection" content="telephone=no">
<title>P4 數學　動畫圖解</title>
<style>
  :root{
    --bg:#f4f6ff; --card:#fff; --ink:#1b2140; --ink-soft:#5b6285; --line:#e3e7f5;
    --indigo:#4f46e5; --indigo-soft:#eef0ff;
    --amber:#f59e0b; --amber-soft:#fff5e0;
    --green:#16a34a; --green-soft:#e8f8ee;
    --red:#dc2626; --red-soft:#fdeaea;
    --sky:#0ea5e9; --sky-soft:#e6f6fe;
    --purple:#9333ea; --pink:#db2777;
    --shadow:0 6px 24px rgba(35,45,110,.08);
    --shadow-lg:0 14px 40px rgba(35,45,110,.13);
    --r:20px; --pad:clamp(16px,3.2vw,28px);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
    --ease:cubic-bezier(.34,1.3,.5,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;
    font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:18px; line-height:1.85;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    touch-action:manipulation;
  }
  button{font-family:inherit;touch-action:manipulation}
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 14px rgba(35,45,110,.06);
    padding-top:var(--safe-t);
  }
  .topbar-in{
    max-width:980px;margin:0 auto;
    padding:8px max(var(--pad),var(--safe-r)) 8px max(var(--pad),var(--safe-l));
    display:flex;align-items:center;gap:8px;min-height:58px;
  }
  .brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .brand .txt{display:inline}
  @media(max-width:560px){
    .brand .txt{display:none}
    .topbar-in{gap:6px}
    .iconbtn{width:46px;height:46px;font-size:19px}
  }
  .brand .logo{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#db2777);
    display:grid;place-items:center;font-size:19px;flex:0 0 auto;color:#fff;
  }
  .spacer{flex:1}
  .iconbtn{
    width:50px;height:50px;border-radius:14px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:20px;cursor:pointer;
    display:grid;place-items:center;transition:background .15s,transform .1s;flex:0 0 auto;
  }
  .iconbtn:active{transform:scale(.92);background:var(--indigo-soft)}
  .iconbtn.off{opacity:.42}
  .iconbtn.on{
    background:linear-gradient(135deg,var(--indigo),var(--purple));
    color:#fff;border-color:transparent;
    box-shadow:0 4px 14px rgba(79,70,229,.34);
  }

  .screen{
    max-width:980px;margin:0 auto;display:none;
    padding:22px max(var(--pad),var(--safe-r)) calc(112px + var(--safe-b)) max(var(--pad),var(--safe-l));
  }
  .screen.active{display:block;animation:fade .24s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h1.title{
    margin:0 0 8px;font-size:clamp(28px,4.6vw,40px);line-height:1.3;font-weight:900;
    background:linear-gradient(100deg,#4f46e5,#9333ea 50%,#db2777);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--ink-soft);font-size:17px;margin:0 0 22px}

  /* ---- hub cards ---- */
  .grid{display:grid;grid-template-columns:1fr;gap:13px}
  @media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}
  .ccard{
    position:relative;overflow:hidden;cursor:pointer;text-align:left;
    background:#fff;border:2px solid var(--line);border-radius:18px;
    padding:17px 20px;min-height:112px;transition:transform .15s,border-color .15s,box-shadow .15s;
    display:flex;flex-direction:column;gap:4px;
  }
  .ccard::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--cc,#4f46e5)}
  .ccard::after{
    content:"";position:absolute;right:-46px;top:-46px;width:140px;height:140px;border-radius:50%;
    background:var(--cc,#4f46e5);opacity:.09;pointer-events:none;
  }
  .ccard:hover{transform:translateY(-2px);border-color:var(--cc);box-shadow:var(--shadow)}
  .ccard:active{transform:scale(.985)}
  .ccard .ct{font-size:18.5px;font-weight:800;display:flex;align-items:center;gap:10px;line-height:1.35}
  .ccard .ci{font-size:24px;line-height:1}
  .ccard .cd{font-size:15.5px;color:var(--ink-soft);line-height:1.6}
  .ccard .cn{font-size:13.5px;font-weight:800;color:var(--cc);margin-top:2px}

  /* ---- player ---- */
  .pbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .pbar .pt{font-size:20px;font-weight:800;line-height:1.35}
  .pbar .ps{font-size:14px;color:var(--ink-soft);font-weight:400}

  .stagewrap{
    position:relative;background:#fff;border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;
  }
  .stage{
    position:relative;width:100%;aspect-ratio:16/9;
    background:radial-gradient(circle at 50% 22%,#fbfcff,#f2f5ff 65%,#e9edff);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .stage.tall{aspect-ratio:4/3}
  @media(max-width:560px){ .stage{aspect-ratio:4/3} }

  /* generic animated bits */
  .fx{transition:all .55s var(--ease)}
  .fx-slow{transition:all .85s var(--ease)}
  .dim{opacity:.16 !important;filter:grayscale(1)}
  .glow{filter:drop-shadow(0 0 14px rgba(79,70,229,.55))}

  /* ---- vertical multiplication ---- */
  .vmult{display:grid;grid-template-columns:repeat(5,1fr);gap:3px 0;
         font-family:"SF Mono",ui-monospace,"Consolas",monospace;
         font-size:clamp(22px,4.6vw,34px);font-weight:800;color:#242a52;
         place-items:center;padding:10px 18px;min-width:min(340px,72vw)}
  .vmult span{display:block;text-align:center;transition:all .45s var(--ease)}
  .vmult .hid{opacity:0;transform:translateY(-16px) scale(.8)}
  .vmult .op{color:#8b91b3}
  .vmult .hl{color:var(--red);transform:scale(1.22)}
  .vmult .res{color:var(--green)}
  .vline{grid-column:1/-1;height:3px;background:#242a52;border-radius:2px;margin:2px 0;
         transform:scaleX(0);transition:transform .5s var(--ease);transform-origin:right}
  .vline.on{transform:scaleX(1)}
  .ghost0{color:#b9bfd8 !important;font-style:italic}

  .tagbox{
    position:absolute;left:50%;transform:translate(-50%,10px);bottom:14px;
    background:#fff;border:2px solid var(--indigo);color:var(--indigo);
    padding:7px 18px;border-radius:999px;font-size:clamp(14px,2.4vw,17px);font-weight:800;
    opacity:0;transition:all .45s var(--ease);pointer-events:none;white-space:nowrap;
    box-shadow:0 6px 18px rgba(79,70,229,.22);max-width:92%;
  }
  .tagbox.on{opacity:1;transform:translate(-50%,0)}

  /* ---- tokens (tiles) ---- */
  .tokrow{position:relative;width:100%;height:100%}
  .tok{
    position:absolute;top:50%;
    display:flex;align-items:center;justify-content:center;
    min-width:clamp(58px,11vw,84px);height:clamp(58px,11vw,84px);
    border-radius:18px;font-size:clamp(20px,3.6vw,28px);font-weight:900;
    background:#fff;border:3px solid #c7ccf7;color:#2a3157;
    transform:translate(-50%,-50%);transition:all .6s var(--ease);
    box-shadow:0 6px 18px rgba(35,45,110,.10);
  }
  .tok.pair{border-color:var(--green);background:var(--green-soft);color:#0f7a3a;
            box-shadow:0 0 0 6px rgba(22,163,74,.16),0 8px 22px rgba(22,163,74,.22)}
  .tok.op2{border:none;background:transparent;box-shadow:none;color:#8b91b3;min-width:0;font-size:26px}
  .tok.big{background:linear-gradient(135deg,#16a34a,#0f9b52);color:#fff;border:none;
           box-shadow:0 10px 26px rgba(22,163,74,.35)}

  /* ---- axis for trial quotient ---- */
  .axis{position:relative;width:86%;height:150px}
  .axisline{position:absolute;left:0;right:0;top:96px;height:4px;background:#c7ccf7;border-radius:2px}
  .tick{position:absolute;top:88px;width:2px;height:20px;background:#a9b0d6;transform:translateX(-1px)}
  .tlabel{position:absolute;top:112px;transform:translateX(-50%);font-size:13.5px;
          font-weight:800;color:#6b7299;white-space:nowrap}
  .mlabel{position:absolute;top:22px;transform:translateX(-50%);font-size:15px;
          font-weight:900;color:#2a3157;white-space:nowrap;opacity:0;transition:all .5s var(--ease)}
  .mlabel.on{opacity:1}
  .pins{position:absolute;top:70px;width:6px;height:56px;border-radius:3px;transform:translateX(-3px);
        background:#c7ccf7;transition:all .5s var(--ease)}
  .pins.on{height:80px;top:58px}
  .pins.good{background:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.18)}
  .pins.bad{background:var(--red);box-shadow:0 0 0 4px rgba(220,38,38,.18);animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(-3px)}25%{transform:translateX(-11px)}75%{transform:translateX(5px)}}

  /* ---- dots ---- */
  .dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:center;
        width:88%;max-width:520px}
  .dot{
    width:clamp(15px,2.6vw,21px);height:clamp(15px,2.6vw,21px);border-radius:50%;
    background:#c7ccf7;transition:all .4s var(--ease);
  }
  .dot.g1{background:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.20)}
  .dot.g2{background:#6ee7b7;box-shadow:0 0 0 3px rgba(16,185,129,.22)}
  .dot.left{background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.25);transform:scale(1.15)}
  .dot.fade{opacity:.18;filter:grayscale(1);transform:scale(.7)}
  .dot.extra{background:#f472b6;box-shadow:0 0 0 4px rgba(219,39,119,.25);animation:popdot .45s}
  @keyframes popdot{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1.15)}}

  /* ---- shapes ---- */
  .shapewrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  svg{max-width:100%;max-height:100%;display:block;overflow:visible}

  /* ---- number digits ---- */
  .bignum{display:flex;gap:clamp(4px,1.2vw,12px);font-family:"SF Mono",ui-monospace,"Consolas",monospace;
          font-size:clamp(46px,9vw,76px);font-weight:900;color:#2a3157;line-height:1}
  .bignum .dg{transition:all .5s var(--ease)}
  .bignum .dg.up{transform:translateY(-22px) scale(1.18);color:var(--amber)}
  .bignum .dg.sep{opacity:.15}
  .sumline{display:flex;align-items:center;gap:12px;font-size:clamp(24px,4.4vw,34px);
           font-weight:900;color:#2a3157;margin-top:6px;opacity:0;transition:all .5s var(--ease)}
  .sumline.on{opacity:1}

  /* ---- compass ---- */
  .compass{position:relative;width:min(300px,74vw);aspect-ratio:1}
  .needle{transform-origin:50% 50%;transition:transform .85s cubic-bezier(.34,1.32,.5,1)}
  .arc{fill:none;stroke:var(--indigo);stroke-width:7;stroke-linecap:round;
       stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset .8s ease}
  .arc.on{stroke-dashoffset:0}

  /* ---- boxes ---- */
  .boxes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:88%;max-width:520px}
  .box{
    width:clamp(26px,5vw,36px);height:clamp(26px,5vw,36px);border-radius:7px;
    border:2.5px dashed #b9bfd8;transition:all .45s var(--ease);position:relative;
  }
  .box.full{border-style:solid;border-color:var(--indigo);background:var(--indigo-soft)}
  .box.new{border-color:var(--pink);background:#fdecf5;animation:popdot .5s}

  /* ---- caption + controls ---- */
  .cap{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px;min-height:112px;
  }
  .cap .ch{display:flex;align-items:center;gap:10px;font-size:18.5px;font-weight:800;margin-bottom:6px}
  .cap .cn2{width:30px;height:30px;border-radius:10px;background:var(--indigo-soft);color:var(--indigo);
            display:grid;place-items:center;font-size:15px;font-weight:900;flex:0 0 auto}
  .cap .cb{font-size:17px;color:#2a3157;line-height:1.85}
  .cap .cb b{color:var(--indigo)}
  .cap .cb .r{color:var(--red);font-weight:800}
  .cap .cb .g{color:var(--green);font-weight:800}

  /* ---- Cantonese narration ---- */
  .narr{
    display:flex;align-items:flex-start;gap:10px;
    margin-top:12px;padding:12px 15px;border-radius:14px;
    background:linear-gradient(120deg,#f5f3ff,#fdf2f8);
    border:1px dashed #d8cffb;
    font-size:16.5px;line-height:1.8;color:#3a3160;
    transition:opacity .25s;
  }
  .narr .nic{flex:0 0 auto;font-size:17px;line-height:1.5}
  .narr .ntx{flex:1;min-width:0}
  .narr .nk{
    display:block;font-size:12px;font-weight:800;letter-spacing:1.2px;
    color:#8b5cf6;margin-bottom:2px;
  }
  .narr.speaking{
    background:linear-gradient(120deg,#ede9fe,#fce7f3);
    border-style:solid;border-color:#c4b5fd;
    box-shadow:0 0 0 3px rgba(139,92,246,.10);
  }
  .narr.hidden{display:none}

  @keyframes nbar{
    0%{transform:scaleY(.35)}
    50%{transform:scaleY(1)}
    100%{transform:scaleY(.35)}
  }
  .nbar{display:inline-flex;gap:2px;align-items:center;height:14px;margin-left:4px;vertical-align:-2px}
  .nbar i{
    display:block;width:3px;height:100%;border-radius:2px;background:#8b5cf6;
    transform-origin:bottom;animation:nbar .9s ease-in-out infinite;
  }
  .nbar i:nth-child(2){animation-delay:.15s}
  .nbar i:nth-child(3){animation-delay:.3s}
  .nbar i:nth-child(4){animation-delay:.45s}
  .narr:not(.speaking) .nbar{display:none}

  .iconbtn.talking{
    background:linear-gradient(135deg,#8b5cf6,#db2777);color:#fff;border-color:transparent;
    animation:nbarpulse 1.1s ease-in-out infinite;
  }
  @keyframes nbarpulse{
    0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.45)}
    60%{box-shadow:0 0 0 9px rgba(139,92,246,0)}
  }

  .dots-row{display:flex;gap:7px;justify-content:center;margin:0 0 14px}
  .pd{width:9px;height:9px;border-radius:50%;background:#d7dcf2;transition:all .3s var(--ease)}
  .pd.on{background:var(--indigo);width:26px;border-radius:99px}
  .pd.done{background:#a5b4fc}

  .controls{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px}
  .cbtn{
    min-height:60px;border-radius:16px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font-size:17px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;
    transition:.15s;
  }
  .cbtn:active{transform:scale(.96)}
  .cbtn:hover{background:var(--indigo-soft);border-color:#c7ccf7}
  .cbtn:disabled{opacity:.36;cursor:default}
  .cbtn.play{
    background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;border:none;
    box-shadow:0 8px 22px rgba(79,70,229,.32);font-size:18px;
  }
  .cbtn.play:hover{filter:brightness(1.08)}

  /* ---- tab bar ---- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    background:rgba(255,255,255,.90);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
    border-top:1px solid rgba(35,45,110,.08);
    box-shadow:0 -6px 26px rgba(35,45,110,.10);
  }
  .tabbar-in{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .tabitem{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:54px;border-radius:15px;text-decoration:none;
    color:#8b91b3;font-size:11.5px;font-weight:800;letter-spacing:.1px;
    transition:color .16s,background .16s,transform .1s;-webkit-tap-highlight-color:transparent;
  }
  .tabitem .ti{font-size:21px;line-height:1;transition:transform .22s var(--ease);filter:grayscale(.55);opacity:.85}
  .tabitem:active{transform:scale(.95);background:rgba(79,70,229,.07)}
  .tabitem.on{color:var(--indigo);background:linear-gradient(180deg,rgba(79,70,229,.10),rgba(79,70,229,.03))}
  .tabitem.on .ti{filter:none;opacity:1;transform:translateY(-1px) scale(1.1)}
  .tabitem.on::after{
    content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    width:20px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--pink));
  }
  .tabbadge{
    position:absolute;top:3px;left:calc(50% + 8px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;
    background:linear-gradient(135deg,#ef4444,#db2777);color:#fff;font-size:11px;font-weight:800;line-height:19px;
    box-shadow:0 2px 8px rgba(220,38,38,.45);display:grid;place-items:center;
  }
  .tabbadge[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){
    .fx,.fx-slow,.tok,.dot,.box,.needle,.vmult span{transition-duration:.15s !important}
  }

  @media print{
    .wbpane,.wb-scrim{ display:none !important; }
    body.wb-open .layout{ grid-template-columns:1fr; padding-right:0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="logo">🎬</span><span class="txt">動畫圖解</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="voiceBtn" aria-label="旁白開關" title="旁白開關">🗣️</button>
    <button class="iconbtn" id="soundBtn" aria-label="音效開關">🔊</button>
    <button class="iconbtn" id="homeBtn" aria-label="返回">🏠</button>
  </div>
</div>


<!-- ============ HUB ============ -->
<div class="screen active" id="scr-hub">
  <h1 class="title">看一遍就懂</h1>
  <p class="sub">揀一個概念，逐步播放。每一步都有文字解釋。</p>
  <div class="grid" id="hubGrid"></div>
</div>

<!-- ============ PLAYER ============ -->
<div class="screen" id="scr-play">
  <div class="pbar">
    <button class="iconbtn" id="backBtn" aria-label="返回">←</button>
    <div>
      <div class="pt" id="pT"></div>
      <div class="ps" id="pS"></div>
    </div>
  </div>

  <div class="stagewrap">
    <div class="stage" id="stage"></div>
  </div>

  <div class="dots-row" id="stepsDots"></div>

  <div class="cap">
    <div class="ch"><span class="cn2" id="capN">1</span><span id="capT">…</span></div>
    <div class="cb" id="capB"></div>
    <div class="narr" id="narrBox">
      <span class="nic" aria-hidden="true">🗣️</span>
      <span class="ntx"><span class="nk">廣東話旁白</span><span id="narrTx">…</span><span class="nbar" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span>
    </div>
  </div>

  <div class="controls">
    <button class="cbtn" id="prevBtn" aria-label="上一步">←</button>
    <button class="cbtn play" id="playBtn">▶ 播放</button>
    <button class="cbtn" id="nextBtn" aria-label="下一步">→</button>
    <button class="cbtn" id="resetBtn" aria-label="重播">↺</button>
  </div>
</div>

<nav class="tabbar" aria-label="頁面切換">
  <div class="tabbar-in">
    <a class="tabitem" href="revision.html"><span class="ti">📖</span><span>溫習</span></a>
    <a class="tabitem on" href="concepts.html" aria-current="page"><span class="ti">🎬</span><span>動畫</span></a>

<script src="./assets/wb.js"></script>
<script>
(function(){
'use strict';

var $ = function(s){ return document.querySelector(s); };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b,v)); };

/* =========================================================
   音效引擎（全部即時合成，無外部檔案）
   ========================================================= */
var actx = null, muted = false, noiseBuf = null;

function ac(){
  if (!actx) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function noise(){
  var a = ac(); if (!a) return null;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate * 0.4, a.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  var s = a.createBufferSource(); s.buffer = noiseBuf; return s;
}

/* 一個音 */
function tone(o){
  if (muted) return;
  var a = ac(); if (!a) return;
  var f0 = o.f, f1 = (o.to === undefined ? o.f : o.to);
  var t0 = a.currentTime + (o.delay || 0);
  var dur = o.dur || .16;
  var osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f0, t0);
  if (o.to !== undefined) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  }
  var vol = (o.vol === undefined ? .10 : o.vol);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + (o.atk || .008));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0 + dur + .02);
}

var sfx = {
  /* 元素出現：溫暖的馬林巴 */
  pop: function(i){
    var base = 523.25;
    var steps = [0,2,4,7,9,12];
    var semi = steps[(i||0) % steps.length];
    var f = base * Math.pow(2, semi/12);
    tone({ f:f, dur:.22, type:'sine', vol:.085 });
    tone({ f:f*2, dur:.10, type:'sine', vol:.028, delay:.01 });
  },
  /* 數字跳出來 */
  blip: function(i){
    tone({ f: 880 * Math.pow(2, ((i||0)%6)*2/12), dur:.11, type:'triangle', vol:.055 });
  },
  /* 正確 / 對齊 */
  good: function(){
    tone({ f:659.25, dur:.13, vol:.075 });
    tone({ f:987.77, dur:.20, vol:.07, delay:.09 });
  },
  /* 成功完成 */
  chime: function(){
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f,i){
      tone({ f:f, dur:.42, type:'sine', vol:.075, delay:i*.085 });
    });
  },
  /* 錯誤 / 太大 */
  buzz: function(){
    tone({ f:190, to:120, dur:.26, type:'sawtooth', vol:.055 });
    tone({ f:196, to:124, dur:.26, type:'square', vol:.022 });
  },
  /* 掃過去 */
  whoosh: function(){
    if (muted) return;
    var a = ac(); if (!a) return;
    var s = noise(); if (!s) return;
    var f = a.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(420, a.currentTime);
    f.frequency.exponentialRampToValueAtTime(2600, a.currentTime + .34);
    f.Q.value = 1.1;
    var g = a.createGain();
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.055, a.currentTime + .05);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .36);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(); s.stop(a.currentTime + .4);
  },
  /* 轉一下 */
  tick: function(){
    tone({ f:1400, dur:.05, type:'square', vol:.035 });
  },
  /* 彈一下 */
  boing: function(){
    tone({ f:420, to:820, dur:.16, type:'sine', vol:.075 });
  },
  /* 吞掉 / 消失 */
  swoosh: function(){
    tone({ f:900, to:300, dur:.24, type:'sine', vol:.05 });
  }
};

/* =========================================================
   共用小工具
   ========================================================= */
function el(tag, cls, html){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function stagger(nodes, cls, gap){
  nodes.forEach(function(n,i){
    setTimeout(function(){ n.classList.add(cls); sfx.blip(i); }, i * (gap||70));
  });
}

/* =========================================================
   場景 1：直式乘法 —— 第二行為何要縮一格
   ========================================================= */
var SC1 = {
  id:'mulcol', icon:'✖️', color:'#4f46e5',

  desc:'19 × 24 逐步拆解，看清那個「隱形的 0」',
  steps:[

    { t:'先乘個位：19 × 4', c:'24 的個位是 <b>4</b>，先用它乘 19：<b class="g">19 × 4 = 76</b>。', d:2400 },
    { t:'再乘十位：那個 2 其實是 20', c:'24 的十位是 <b>2</b>，但它站在十位，真正的值是 <b class="r">20</b>，不是 2。', d:2600 },
    { t:'19 × 20 = 380', c:'所以第二行要算 <b class="g">19 × 20 = 380</b>。注意那個 <b>0</b> ——它要寫在個位。', d:2600 },
    { t:'兩行相加', c:'<b>380 + 76 = 456</b>。所以 <b class="g">19 × 24 = 456</b>。', d:2400 },
    { t:'記住這個口訣', c:'第二行要向左縮一格。<br>不是死記——是因為它代表「<b>× 幾十</b>」，所以最後一定有 0。', d:2600 }
  ],
  mount: function(stage){
    var rows = [
      ['','','1','9'],
      ['×','','2','4'],
      [null,'3','8','0'],
      ['','','7','6'],
      [null,'4','5','6']
    ];
    var wrap = el('div','vmult');
    var cells = {};
    rows.forEach(function(r,ri){
      if (ri === 2 || ri === 4) {
        var ln = el('div','vline');
        wrap.appendChild(ln);
        cells['line'+ri] = ln;
      }
      r.forEach(function(ch,ci){
        var s = el('span', null, ch === null ? '' : ch);
        if (ci === 0 && (ri === 1)) s.className = 'op';
        if (ri === 2 || ri === 4) s.classList.add('res');
        wrap.appendChild(s);
        cells['r'+ri+'c'+ci] = s;
      });
    });
    stage.appendChild(wrap);
    var tag = el('div','tagbox');
    stage.appendChild(tag);
    return { cells: cells, tag: tag };
  },
  render: function(ref, i){
    var c = ref.cells;
    function show(k, on){ if (c[k]) c[k].classList.toggle('hid', !on); }
    function hl(k, on){ if (c[k]) c[k].classList.toggle('hl', !!on); }

    // 基本顯示
    show('r0c2',true); show('r0c3',true); show('r1c0',true); show('r1c2',true); show('r1c3',true);
    contract(ref.tag, '');

    // 各行
    show('r3c2', i>=1); show('r3c3', i>=1);
    show('r2c1', i>=3); show('r2c2', i>=3); show('r2c3', i>=3);
    show('r4c1', i>=4); show('r4c2', i>=4); show('r4c3', i>=4);

    c.line2.classList.toggle('on', i>=3);
    c.line4.classList.toggle('on', i>=4);

    // 高亮
    hl('r1c3', i===1);
    hl('r1c2', i===2);

    // 隱形 0
    if (c.r2c3) c.r2c3.classList.toggle('ghost0', i===5);

    var txt = '';
    if (i===1) txt = '19 × 4 = 76';
    if (i===2) txt = '十位的 2 代表 20';
    if (i===3) txt = '19 × 20 = 380';
    if (i===4) txt = '380 + 76 = 456';
    if (i===5) txt = '這個 0 是「× 幾十」的證明';
    contract(ref.tag, txt);
  }
};
function contract(node, txt){
  node.textContent = txt;
  node.classList.toggle('on', !!txt);
}

function updateTicks(ticks, pts){
  // pts: x1,y1 ... 每條邊畫一個短記號在中點，方向沿邊
  for (var k=0;k<4;k++){
    var x1 = pts[k*2], y1 = pts[k*2+1];
    var j = (k+1)%4;
    var x2 = pts[j*2], y2 = pts[j*2+1];
    var mx = (x1+x2)/2, my = (y1+y2)/2;
    var dx = x2-x1, dy = y2-y1;
    var len = Math.sqrt(dx*dx+dy*dy) || 1;
    var nx = -dy/len*11, ny = dx/len*11;
    ticks[k].setAttribute('x1', mx-nx); ticks[k].setAttribute('y1', my-ny);
    ticks[k].setAttribute('x2', mx+nx); ticks[k].setAttribute('y2', my+ny);
  }
}

  if (V.warned) return;
  V.warned = true;
  toastMsg('未找到廣東話語音　設定 → 輔助使用 → 語音內容 → 加入「粵語（香港）」', 5200);
}

function pickVoice(){
  if (!V.supported) return null;
  var vs = window.speechSynthesis.getVoices() || [];
  if (!vs.length) return null;
  function score(v){
    var lang = (v.lang || '').toLowerCase().replace('_','-');
    var nm = (v.name || '').toLowerCase();
    var s = 0;
    if (lang === 'zh-hk' || lang === 'yue-hk' || lang === 'yue') s += 100;
    else if (lang === 'zh-yue') s += 95;
    else if (lang === 'zh-tw' || lang === 'zh-hant-tw') s += 60;
    else if (lang.indexOf('zh') === 0) s += 40;
    else return -1;
    if (/cantonese|粵|粤|hong kong|香港/.test(nm)) s += 30;
    if (/sin-?ji|婷婷|mei-?jia|美佳|ting-?ting/.test(nm)) s += 4;
    if (v.localService) s += 5;
    return s;
  }
  var best = null, bestScore = -1;
  vs.forEach(function(v){
    var s = score(v);
    if (s > bestScore) { bestScore = s; best = v; }
  });
  return bestScore < 0 ? null : best;
}

function initVoices(){
  if (!V.supported) return;
  V.voice = pickVoice();
  if (!V.voice) {
    // getVoices 有時要等一秒先有結果
    setTimeout(function(){ V.voice = pickVoice(); }, 400);
    setTimeout(function(){ V.voice = pickVoice(); }, 1400);
  }
}
if (V.supported) {
  initVoices();
  if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
    window.speechSynthesis.onvoiceschanged = initVoices;
  }
}

function stripTags(s){
  return String(s).replace(/<br\s*\/?>/gi, '，').replace(/<[^>]+>/g, '');
}

/* 用廣東話讀一句 */
function speak(text, opts){
  if (!V.on || !V.supported || !text) return;
  opts = opts || {};
  var syn = window.speechSynthesis;
  try { syn.cancel(); } catch(e) {}

  var u = new SpeechSynthesisUtterance(text);
  var v = V.voice || pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; }
  else {
    u.lang = 'zh-HK';
    var vs = syn.getVoices() || [];
    if (vs.length && !vs.some(function(x){ return /^zh/i.test(x.lang || ''); })) warnNoVoice();
  }
  u.rate = opts.rate || 0.92;
  u.pitch = 1.02;
  u.volume = 1;

  u.onstart = function(){
    V.speaking = true;
    markNarr(true);
    if (opts.onstart) opts.onstart();
  };
  u.onend = u.onerror = function(){
    V.speaking = false;
    markNarr(false);
    if (opts.onend) opts.onend();
  };

  V.tokens.push(u);
  if (V.tokens.length > 12) V.tokens.shift();
  syn.speak(u);
}

function stopSpeak(){
  if (!V.supported) return;
  try { window.speechSynthesis.cancel(); } catch(e) {}
  V.speaking = false;
  markNarr(false);
}

function markNarr(on){
  var box = document.getElementById('narrBox');
  if (box) box.classList.toggle('speaking', !!on);
  var btn = document.getElementById('voiceBtn');
  if (btn) btn.classList.toggle('talking', !!on);
}

/* =========================================================
   播放器
   ========================================================= */
var P = {
  sc: null, ref: null, i: 0, playing: false, timer: null
};

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $('#'+id).classList.add('active');
  window.scrollTo({ top:0, behavior:'instant' });
}

function buildHub(){
  var g = $('#hubGrid');
  g.innerHTML = '';
  SCENES.forEach(function(sc){
    var c = el('div','ccard');
    c.style.setProperty('--cc', sc.color);
    c.innerHTML = '<div class="ct"><span class="ci">'+sc.icon+'</span>'+sc.title+'</div>'
      + '<div class="cd">'+sc.desc+'</div>'
      + '<div class="cn">'+sc.steps.length+' 步 →</div>';
    c.addEventListener('click', function(){ openScene(sc); });
    g.appendChild(c);
  });
}

function openScene(sc){
  P.sc = sc; P.i = 0; P.playing = false;
  clearTimeout(P.timer);
  stopSpeak();

  $('#pT').textContent = sc.title;
  $('#pS').textContent = sc.steps.length + ' 步　·　' + sc.desc;

  var stage = $('#stage');
  stage.innerHTML = '';
  stage.className = 'stage' + (sc.id === 'mulcol' ? '' : '');
  P.ref = sc.mount(stage);

  buildDots();
  show('scr-play');
  setStep(0, true);
  sfx.whoosh();
  if (V.on) setTimeout(function(){ narrateStep(0); }, 380);
}

function buildDots(){
  var d = $('#stepsDots');
  d.innerHTML = '';
  P.sc.steps.forEach(function(){ d.appendChild(el('div','pd')); });
}

function narrLine(i){
  var arr = NARR[P.sc.id];
  return arr ? arr[i] : '';
}

function narrateStep(i){
  var line = narrLine(i);
  if (!line || !V.on) return;
  // 先停音效，避免同旁白打架
  speak(line, { rate: 0.92 });
}

function setStep(i, silent){
  P.i = clamp(i, 0, P.sc.steps.length - 1);
  var s = P.sc.steps[P.i];

  P.sc.render(P.ref, P.i);

  $('#capN').textContent = P.i + 1;
  $('#capT').textContent = s.t;
  $('#capB').innerHTML = s.c;

  // 旁白文字
  var line = narrLine(P.i);
  var box = $('#narrBox');
  var tx = $('#narrTx');
  if (line && V.supported) {
    box.classList.remove('hidden');
    tx.textContent = line;
  } else {
    box.classList.add('hidden');
  }

  var dots = $('#stepsDots').children;
  for (var k=0;k<dots.length;k++){
    dots[k].className = 'pd' + (k === P.i ? ' on' : (k < P.i ? ' done' : ''));
  }

  $('#prevBtn').disabled = P.i === 0;
  $('#nextBtn').disabled = P.i === P.sc.steps.length - 1;

  if (!silent) {
    P.sc.sound ? P.sc.sound(P.i) : sfx.pop(P.i);
    // 自動播放時由 tick() 負責朗讀（佢要等 onend 才跳步），
    // 呢度只負責手動點擊時的旁白，否則會重複讀兩次
    if (!P.playing) narrateStep(P.i);
  }
}

/* 用真正的「朗讀完畢」事件推進，不再靠估算時間
   每個 speakThen 有自己嘅計時器，唔會同外面嘅 P.timer 打架 */
function speakThen(text, done, fallbackMs){
  var finished = false;
  var guardId = null;
  var tailId = null;
  var started = false;

  function finish(){
    if (finished) return;
    finished = true;
    if (guardId) { clearInterval(guardId); guardId = null; }
    if (tailId) { clearTimeout(tailId); tailId = null; }
    if (done) done();
  }

  // 沒有旁白 / 不支援 / 關掉了 → 用步驟本身的停頓時間
  if (!V.on || !V.supported || !text) {
    tailId = setTimeout(finish, fallbackMs || 2200);
    return;
  }

  var syn = window.speechSynthesis;
  try { syn.cancel(); } catch(e) {}

  var u = new SpeechSynthesisUtterance(text);
  var v = V.voice || pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'zh-HK'; }
  u.rate = 0.92; u.pitch = 1.02; u.volume = 1;

  u.onstart = function(){
    started = true;
    V.speaking = true;
    markNarr(true);
  };
  u.onend = function(){
    V.speaking = false;
    markNarr(false);
    if (finished) return;
    // 講完之後留一點呼吸位，讓小朋友消化
    tailId = setTimeout(finish, 420);
  };
  u.onerror = function(){
    V.speaking = false;
    markNarr(false);
    if (finished) return;
    tailId = setTimeout(finish, 420);
  };

  V.tokens.push(u);
  if (V.tokens.length > 12) V.tokens.shift();
  syn.speak(u);

  // 保險：極少數瀏覽器唔會觸發 onend。
  // 只喺「已經開始讀，但引擎明顯已經唔再忙，而且等咗一段合理時間」才接手，
  // 避免將本來正在讀的一句當成完成。
  var startedAt = 0;
  guardId = setInterval(function(){
    if (finished) { clearInterval(guardId); guardId = null; return; }
    if (!started) return;
    var busy = true;
    try { busy = !!(syn.speaking || syn.pending); } catch(e) { busy = false; }

    if (busy) { startedAt = 0; return; }
    if (!startedAt) { startedAt = Date.now(); return; }

    // 引擎靜咗超過 1.5 秒都冇 onend → 真係卡住，接手
    if (Date.now() - startedAt > 1500) {
      clearInterval(guardId); guardId = null;
      V.speaking = false;
      markNarr(false);
      finish();
    }
  }, 250);
}

function playFrom(i){
  P.playing = true;
  $('#playBtn').textContent = '⏸ 暫停';
  // setStep(i, true) = 唔發音效、唔朗讀，跟住由 tick() 負責朗讀
  if (i !== undefined) setStep(i, true);
  tick();
}

function tick(){
  if (!P.playing) return;

  // 讀完「目前這一步」才跳下一步
  var stepDelay = (P.sc.steps[P.i].d || 2200);

  speakThen(narrLine(P.i), function(){
    if (!P.playing) return;

    if (P.i >= P.sc.steps.length - 1) {
      P.playing = false;
      $('#playBtn').textContent = '▶ 播放';
      if (!muted) sfx.chime();
      return;
    }

    setStep(P.i + 1);
    tick();
  }, stepDelay);
}

function stopPlay(){
  P.playing = false;
  clearTimeout(P.timer);
  stopSpeak();
  $('#playBtn').textContent = '▶ 播放';
}

/* ---------- 事件 ---------- */
$('#playBtn').addEventListener('click', function(){
  ac();
  if (P.playing) { stopPlay(); return; }
  var from = (P.i >= P.sc.steps.length - 1) ? 0 : P.i;
  if (from === 0 && P.i === P.sc.steps.length - 1) setStep(0, true);
  playFrom(from);
});
$('#nextBtn').addEventListener('click', function(){ stopPlay(); setStep(P.i + 1); });
$('#prevBtn').addEventListener('click', function(){ stopPlay(); setStep(P.i - 1); });
$('#resetBtn').addEventListener('click', function(){ stopPlay(); setStep(0); sfx.whoosh(); });
$('#backBtn').addEventListener('click', function(){ stopPlay(); stopSpeak(); show('scr-hub'); });
$('#homeBtn').addEventListener('click', function(){ stopPlay(); stopSpeak(); show('scr-hub'); });
window.addEventListener('pagehide', stopSpeak);
window.addEventListener('beforeunload', stopSpeak);
document.addEventListener('visibilitychange', function(){
  if (document.hidden) stopSpeak();
});

$('#soundBtn').addEventListener('click', function(e){
  muted = !muted;
  e.currentTarget.textContent = muted ? '🔈' : '🔊';
  e.currentTarget.classList.toggle('off', muted);
  if (!muted) { ac(); sfx.pop(0); }
});

/* 旁白開關 */
$('#voiceBtn').addEventListener('click', function(e){
  V.on = !V.on;
  e.currentTarget.textContent = V.on ? '🗣️' : '🚫';
  e.currentTarget.classList.toggle('off', !V.on);
  var box = document.getElementById('narrBox');
  if (!V.on) {
    stopSpeak();
    if (box) box.classList.add('hidden');
    toastMsg('旁白已關閉');
  } else {
    initVoices();
    if (box && narrLine(P.i)) box.classList.remove('hidden');
    toastMsg('旁白已開啟');
    setTimeout(function(){ narrateStep(P.i); }, 160);
  }
});

/* 輕按旁白文字 → 再讀一次 */
var nb = document.getElementById('narrBox');
if (nb) {
  nb.style.cursor = 'pointer';
  nb.addEventListener('click', function(){
    if (!V.on) { V.on = true; var vb = document.getElementById('voiceBtn'); vb.textContent='🗣️'; vb.classList.remove('off'); }
    narrateStep(P.i);
  });
}

/* 簡單提示 */
function toastMsg(msg, dur){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));'
    + 'transform:translate(-50%,14px);background:#1b2140;color:#fff;padding:13px 22px;'
    + 'border-radius:22px;font-size:15px;font-weight:700;z-index:99;opacity:0;'
    + 'transition:.28s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.22);'
    + 'max-width:min(86vw,460px);white-space:normal;text-align:center;line-height:1.65';
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity = '1'; t.style.transform = 'translate(-50%,0)'; });
  setTimeout(function(){
    t.style.opacity = '0';
    t.style.transform = 'translate(-50%,14px)';
    setTimeout(function(){ t.remove(); }, 320);
  }, dur || 1700);
}

document.addEventListener('keydown', function(e){
  if (!$('#scr-play').classList.contains('active')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stopPlay(); setStep(P.i+1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stopPlay(); setStep(P.i-1); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); narrateStep(P.i); }
  else if (e.key === 'Escape') { stopPlay(); stopSpeak(); show('scr-hub'); }
});

/* ---------- 錯題 badge ---------- */
try {
  var raw = localStorage.getItem('p4p_mistakes');
  var ms = raw ? JSON.parse(raw) : [];
  var b = document.getElementById('tabBadge');
  if (b && ms && ms.length) { b.textContent = ms.length > 99 ? '99+' : ms.length; b.hidden = false; }
} catch(e) {}

buildHub();
})();
</script>
